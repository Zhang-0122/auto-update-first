name: Check live site

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r double/requirements.txt

      - name: Check public Netlify site
        env:
          SITE_URL: "https://fanciful-unicorn-343425.netlify.app"
        run: python scripts/check_live_site.py

